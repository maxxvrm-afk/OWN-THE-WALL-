<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506;color:#777;font-family:system-ui}#boot{position:fixed;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;letter-spacing:.12em}</style></head><body><div id="boot">LOADING LIVE GENESIS CORE…</div><script>(async()=>{try{let r=await fetch('/api/wall-source?wall='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('wall '+r.status);let h=await r.text();const hook=`<style>html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#050506!important}body>*:not(#otwWallStage):not(script):not(style){display:none!important}#otwWallStage{display:block!important;position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;background:#070708!important;overflow:hidden!important}#otwWallStage #c{opacity:0!important}#otwWallStage #realDom{display:block!important;z-index:7!important}#otwWallExplore,#otwWallLiveBadge,#otwWallFullscreenBar,#menu,.promos,.zoom{display:none!important}</style><script>(function(){var n=0,cam,stage,fit=1,last=0;function ready(){stage=document.querySelector('#otwWallStage');cam=window.__OTW_MAP_CAMERA__;if(!stage||!cam){if(n++<120)return setTimeout(ready,100);return}document.body.appendChild(stage);document.getElementById('boot')?.remove();reset();setInterval(clamp,33);setInterval(report,120)}function dims(){var w=stage.clientWidth||innerWidth,h=stage.clientHeight||innerHeight;fit=Math.min(w,h)/(128*1.02);return{w:w,h:h}}function clamp(){if(!cam)return;var d=dims(),a=cam.get(),z=Math.max(fit,Math.min(a.z,fit*12)),span=128*z,ox=a.ox,oy=a.oy;if(span<=d.w)ox=d.w/2-1024*z;if(span<=d.h)oy=d.h/2-1024*z;cam.set(z,ox,oy)}function reset(){if(!cam)return;var d=dims();cam.set(fit,d.w/2-1024*fit,d.h/2-1024*fit)}function zoom(f){var d=dims(),a=cam.get(),z=Math.max(fit,Math.min(a.z*f,fit*12)),wx=(d.w/2-a.ox)/a.z,wy=(d.h/2-a.oy)/a.z;cam.set(z,d.w/2-wx*z,d.h/2-wy*z)}function report(){if(!cam)return;var p=Math.round(cam.get().z/fit*100);if(p!==last){last=p;parent.postMessage({type:'otw-genesis-zoom',pct:p},location.origin)}}addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='otw-genesis-command')return;e.data.cmd==='zoom'?zoom(Number(e.data.value)||1):reset()});document.readyState==='loading'?addEventListener('DOMContentLoaded',ready,{once:true}):ready()})();<\/script>`;document.open();document.write(h.replace('</body>',hook+'</body>'));document.close()}catch(e){document.getElementById('boot').textContent='LIVE WALL COULD NOT LOAD'}})();</script></body></html>
